[project]
name = "seb-xrif"
version = "0.1.0"
description = "Scalable, Evidence-Based XR Integration Framework (SEB-XRIF) MVP"
authors = [{ name = "SEB-XRIF Research Group" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pandera>=0.18.0",
    "scikit-learn>=1.4.0",
    "optuna>=3.6.0",
    "shap>=0.45.0",
    "lime>=0.2.0.1",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "pingouin>=0.5.4",
    "scipy>=1.12.0",
    "joblib>=1.3.2",
    "pyyaml>=6.0.1",
    "dvc>=3.48.0",
    "mlflow>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=analytics --cov=api --cov=eval"
testpaths = ["tests"]
