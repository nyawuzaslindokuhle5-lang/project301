version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: seb_xrif_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seb_user
      POSTGRES_PASSWORD: seb_password
      POSTGRES_DB: seb_xrif
    ports:
      - "5432:5432"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: seb_xrif_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seb_xrif_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mlflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: seb_xrif_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
